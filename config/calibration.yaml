# 較正の方針（#13 / 決定記録 0024）
#
# **記録と方針を分けています。**
#   - `config/calibration.json` … 較正の**記録**。`coldaisle-calibrate` が書く
#   - このファイル              … 較正の**方針**。人が決める
#
# 混ぜると、道具が人の設定を書き換えることになります。

# 較正に使う直近の分数（`--minutes` の既定）
window_minutes: 10.0

# 1チャネルあたりの最低件数。2.5秒周期で約5分ぶん。
# **少ない標本で較正しない。** 雑音をオフセットとして焼き付けることになります
min_samples: 120

# ############################################################################
# 較正を受け付けるセンサー間のばらつきの上限（℃）。
#
# **これを超えるなら、同じ空気に置かれていません。** そのまま較正すると
# **本物の温度勾配をオフセットとして焼き付け**、以降その勾配が見えなくなります。
# `d.intake_rise` は前面吸気と室温の差なので、**再循環そのものが検出できなく
# なります。** 緩めるときは docs/calibration.md の手順1を先に見直してください。
# ############################################################################
max_spread_c: 2.0

# この日数を過ぎたら較正をやり直す（既定は約6ヶ月）。
# 取り込みデーモンが起動時に警告します
revalidate_after_days: 183

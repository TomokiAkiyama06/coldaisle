# 保持期間とロールアップ（FR-202〜205 / 決定記録 0002 §2.8）
#
# **ここが唯一の情報源です。** コードに既定値を持たせないでください
# （AGENTS.md「絶対に守るルール」9）。

# 生データの保持日数。要件 §6.2 の「既定14日」は決定記録 0001 D-02 が
# 30日へ上書きしている。1分・1時間のロールアップは無期限（FR-204）
raw_days: 30
# Control decision trace の保持日数。1秒周期でも保存容量を無制限に増やさない。
# 値の根拠と変更手順は Decision Record 0030 を参照する。
control_trace_days: 30

# 日次CSV（FR-205）の出力先。`~` は展開する
csv_dir: "~/server_sensor_logs"

# 日次CSVの日境界と時刻に使う IANA の timezone 名（決定記録 0100 §2.2）。
# **必須**: 無い・読めないときは `--export-day` だけを拒否する（ロールアップは行う）。
# コードに既定値は無い。`coldaisle-rollup --timezone` は確認用で、ここと文字列で違えば拒否する。
# 書いた文字列がそのまま export manifest と `csv_exports` に残る（別名を正規化しない）
csv_timezone: "Asia/Tokyo"

# 同じ日の export のプロセス間 lock を待つ上限（秒。決定記録 0100 §2.1 / §5 #17）。
# 1日ぶんの export は1秒もかからない。上限を過ぎたら何も書かずに拒否する
csv_export_lock_timeout_s: 60

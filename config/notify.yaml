# 通知の設定（FR-2xx 通知 / #20）
#
# **秘匿情報はここに書かない。** Webhook URL とトークンは環境変数から読む
# （リポジトリは public。#41 / 決定 Q-06）。
#
#   COLDAISLE_SLACK_WEBHOOK   Slack の Incoming Webhook URL
#   COLDAISLE_LINE_TOKEN      LINE Messaging API のチャネルアクセストークン
#   COLDAISLE_LINE_TO         LINE の送信先 ID（ユーザー / グループ）
#
# 未設定の経路は**黙って無効**にはしない。起動時に警告を出し、
# その重大度は `stdout` へ回す。

enabled: true

# 重大度ごとの宛先（決定記録 0135。0001 D-03 を置き換え）。複数指定できる
# critical も warning と同じ Slack（同じ Webhook・同じチャンネル）へ送り、
# 本文の重大度（🔴 critical）で区別する。LINE は使わない。
# 使うときは宛先に `line` を足すだけでよい（LineNotifier は残してある）
routing:
  critical: [slack, stdout]
  warning: [slack, stdout]
  info: [stdout]

# 同じアラートの連投を抑える。初回は必ず送り、以降はこの間隔まで送らない。
# **解除は必ず送る**（鳴りっぱなしと区別できなくなるため）
repeat_after_s: 1800.0

# 夜間の扱い（決定記録 0001 D-04）
night:
  # ローカル時刻。start >= end なら日をまたぐ帯として扱う
  start_hour: 22
  end_hour: 7
  timezone: "Asia/Tokyo"
  # ############################################################################
  # **ベースライン測定（#19）が終わるまで false のままにすること。**
  #
  # 夜間も通知する以上、誤警報が睡眠を削る。「通知が信用されなくなる」より
  # 深刻な実害である（決定記録 0001 D-04 補足）。
  # 閾値を実測で確定してから true にする。
  # ############################################################################
  warning_enabled: false

# 通知本文に載せるダッシュボードの場所（日次レポート・故障疑いの案件の通知も同じ値）。
# サーバー自身から見たアドレスなので、別の端末からは開けない。導入先の実際のアドレスは
# ここに書かず、環境変数 COLDAISLE_DASHBOARD_URL で上書きする（#307。空なら未設定と同じ）。
# どちらの値も http / https の絶対 URL（ホストあり）でなければ起動時に落ちる
dashboard_url: "http://127.0.0.1:8000/"

# 通知の「現在値:」の行の最後に常に付けるメトリクス（決定記録 0142 §2.2a）。
# 「現在値:」はアラートのメトリクスとルールの定義が参照するメトリクス（派生値ならその材料も）だけを出し、
# 最後にこれを付ける（既に出ていれば重ねない）。名前は config/metrics.yaml にあること（無ければ起動時に落ちる）
context_always: [air.room]

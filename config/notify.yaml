# 通知の設定（FR-2xx 通知 / #20）
#
# **秘匿情報はここに書かない。** Webhook URL とトークンは環境変数から読む
# （リポジトリは public。#41 / 決定 Q-06）。
#
#   COLDAISLE_SLACK_WEBHOOK   Slack の Incoming Webhook URL
#   COLDAISLE_LINE_TOKEN      LINE Messaging API のチャネルアクセストークン
#   COLDAISLE_LINE_TO         LINE の送信先 ID（ユーザー / グループ）
#
# 未設定の経路は**黙って無効**にはしない。起動時に警告を出し、
# その重大度は `stdout` へ回す。

enabled: true

# 重大度ごとの宛先（決定記録 0001 D-03）。複数指定できる
routing:
  critical: [line, stdout]
  warning: [slack, stdout]
  info: [stdout]

# 同じアラートの連投を抑える。初回は必ず送り、以降はこの間隔まで送らない。
# **解除は必ず送る**（鳴りっぱなしと区別できなくなるため）
repeat_after_s: 1800.0

# 夜間の扱い（決定記録 0001 D-04）
night:
  # ローカル時刻。start >= end なら日をまたぐ帯として扱う
  start_hour: 22
  end_hour: 7
  timezone: "Asia/Tokyo"
  # ############################################################################
  # **ベースライン測定（#19）が終わるまで false のままにすること。**
  #
  # 夜間も通知する以上、誤警報が睡眠を削る。「通知が信用されなくなる」より
  # 深刻な実害である（決定記録 0001 D-04 補足）。
  # 閾値を実測で確定してから true にする。
  # ############################################################################
  warning_enabled: false

# 通知本文に載せるダッシュボードの場所
dashboard_url: "http://127.0.0.1:8000/"

# ルールエンジンの定義（FR-401〜409 / #18）
#
# ############################################################################
# **閾値はすべて暫定値です。**
#
# 実機到着後、無負荷・軽負荷・フルロードのベースライン測定（#19）を経て
# 確定します。それまでの発火は「この値で鳴る」ことの確認であって、
# 「この値が危険」という意味ではありません。
#
# 変更したら決定記録に残してください（安全性に関わる判断は人間の承認が要る。
# AGENTS.md「迷ったら」）。
# ############################################################################
#
# 共通の項目
#   label         : 短い名前。日次レポートの表に出る
#   title         : 発火の通知の見出しの文
#   resolved_title: 解除の通知の見出しの文
#   hint          : 発火の通知に載せる「確かめること」の一文
#                   （4 つとも**必須**。決定記録 0142 §2.3）
#   enabled       : false にすると評価しない
#   severity      : info | warning | critical
#   fire_after_s  : 条件が続いたら発火するまでの秒数（0 なら即時）
#   threshold     : 発火の閾値
#   clear         : 解除の閾値。**発火と別に持つ**（ヒステリシス。要件 §6.4）
#                   閾値ちょうどを往復するデータでフラッピングしないため
#
# しきい値・範囲のルール（recirculation / intake_high / airflow_degraded / room_high /
# humidity_out_of_range）は、SENSOR_MISSING / SENSOR_FAULT が発火したら、その入力に依る
# 発火待ちを数え直す（決定記録 0139。境界は sensor_missing.consecutive と sensor_fault.silence_s）

rules:
  # FR-401: 30秒以上サンプルが来ない。取り込み・ケーブル・デバイスのどれかが死んでいる
  sensor_fault:
    label: センサーの応答が途絶えた
    title: センサー基板からのデータが途絶えています
    resolved_title: センサー基板からのデータが戻りました
    hint: 基板の USB ケーブルと電源を確認してください。理由は journalctl -u coldaisle-daemon に残っています。
    enabled: true
    severity: critical
    silence_s: 30.0
    fire_after_s: 0.0
    clear_s: 10.0 # 再開してこの秒数だけ届き続けたら解除する

  # FR-402: 特定メトリクスが連続で null / suspect。センサー1本の故障
  sensor_missing:
    label: センサーの値が欠けている
    title: センサーの値が欠けています
    resolved_title: センサーの値が戻りました
    hint: そのセンサーの配線とコネクタが抜けかけていないかを確認してください。
    enabled: true
    severity: warning
    consecutive: 5
    clear_consecutive: 3 # 正常値がこれだけ続いたら解除

  # FR-403: 起動バナーの ROM が前回と違う。プローブの差し替え・入れ替わり
  probe_changed:
    label: プローブが入れ替わった
    title: 温度プローブの入れ替わりを検出しました
    resolved_title: 温度プローブの対応が較正と一致しました
    hint: プローブを差し替えたなら較正をやり直してください（docs/calibration.md）。
    enabled: true
    severity: info

  # FR-404: 排気の再循環。自分の排気を吸っている
  recirculation:
    label: 排気の再循環
    title: 排気が吸気側へ回り込んでいます
    resolved_title: 排気の回り込みが収まりました
    hint: ケースの前後の空きと、排気が前へ戻る経路（壁・棚）がないかを確認してください。
    enabled: true
    severity: warning
    metric: d.intake_rise
    threshold: 5.0
    clear: 4.0
    fire_after_s: 300.0

  # FR-405: GPU 吸気温が高い
  intake_high:
    label: GPU吸気が高い
    title: GPU の吸気温度が高くなっています
    resolved_title: GPU の吸気温度が下がりました
    hint: 室温と、前面の Fan が回っているか、吸気口が塞がれていないかを確認してください。
    enabled: true
    severity: warning
    metric: air.gpu_intake
    threshold: 40.0
    clear: 38.0
    fire_after_s: 120.0

  # FR-406: 風量低下。GPU が空気に与える熱が増えている
  airflow_degraded:
    label: 風量の低下
    title: GPU を通る風量が落ちています
    resolved_title: GPU を通る風量が戻りました
    hint: Fan の回転と、フィルターの詰まり・ケーブルが風路を塞いでいないかを確認してください。
    enabled: true
    severity: warning
    metric: d.gpu_delta
    threshold: 20.0
    clear: 18.0
    fire_after_s: 300.0

  # FR-407: 急上昇。何かが急に起きている（critical）
  rapid_rise:
    label: 温度の急上昇
    title: GPU の吸気温度が急上昇しています
    resolved_title: GPU の吸気温度の急上昇が収まりました
    hint: GPU の前が塞がれていないか、排気が回り込んでいないかを確認してください。
    enabled: true
    severity: critical
    metric: air.gpu_intake
    slope_window_s: 120.0
    threshold: 5.0 # ℃/分
    clear: 3.0
    fire_after_s: 0.0

  # FR-408: 室温が高い。エアコンや外気の問題
  room_high:
    label: 室温が高い
    title: 室温が高くなっています
    resolved_title: 室温が下がりました
    hint: エアコンの運転と設定温度、窓・扉の開け閉めを確認してください。
    enabled: true
    severity: warning
    metric: air.room
    threshold: 30.0
    clear: 28.0
    fire_after_s: 600.0

  # FR-409: 湿度の逸脱。低湿は静電気、高湿は結露。どちらも高額GPUの実害要因
  humidity_out_of_range:
    label: 湿度が範囲の外
    title: 室内の湿度が範囲を外れています
    resolved_title: 室内の湿度が範囲に戻りました
    hint: 低いときは加湿器、高いときは除湿器・エアコンを確認してください（低湿は静電気、高湿は結露のおそれ）。
    enabled: true
    severity: warning
    metric: air.room_humidity
    low: 20.0
    low_clear: 23.0
    high: 70.0
    high_clear: 67.0
    fire_after_s: 600.0

  # 決定記録 0131 §2.1: GPU の Fan の曲線（coldaisle-gpu-fan。0128）が効いていない。
  # 値は coldaisle-telemetry が DB へ書いた NVML の最新値を、評価のたびに読む（0131 §2.3）。
  # 最新値が無い・ok でない（stale。閾値は config/quality.yaml の stale_after_ms）周期は
  # 評価しない（発火待ちは取り消し、発火中は解除の待ちだけを数え直す）。
  # 通知を受けたら `systemctl status coldaisle-gpu-fan` と `journalctl -u coldaisle-gpu-fan`
  # （gpu_fan_model_mismatch などの event）で理由を切り分ける。
  # この 2 つは LLM へ渡さない（config/report.yaml の llm_excluded_rules。0131 §2.4a）

  # GPU の Fan の制御方式が手動でない（＝サービスが握っていない）状態が続く。
  # 30 s は再起動（RestartSec=2 と起動の待ち）を拾わず、600 W で 80 °C に届く約 80 s より短い
  gpu_fan_not_manual:
    label: GPU Fanを曲線のサービスが握っていない
    title: GPU の Fan を曲線のサービスが制御していません
    resolved_title: GPU の Fan を曲線のサービスが再び制御しています
    hint: systemctl status coldaisle-gpu-fan と journalctl -u coldaisle-gpu-fan で理由を確認してください。
    enabled: true
    severity: warning
    metric: gpu.0.fan_policy
    fire_after_s: 30.0
    clear_s: 10.0 # 手動がこの秒数だけ続いたら解除する

  # GPU コアが高いのに Fan が曲線より低い状態が続く（決定記録 0140。provisional）。
  # 0130 の曲線は 80 °C で 75 %。600 W の定常（78〜79 °C・68〜72 %）は発火の温度に届かず、
  # GPU 自身の既定の制御（80 °C で約 47 %）や手動の低い回転のまま残った状態を捉える
  gpu_fan_below_curve:
    label: GPU Fanが曲線より遅い
    title: GPU が熱いのに Fan が曲線より遅く回っています
    resolved_title: GPU の Fan が曲線どおりに戻りました
    hint: systemctl status coldaisle-gpu-fan と journalctl -u coldaisle-gpu-fan で理由を確認してください。
    enabled: true
    severity: warning
    core_metric: gpu.0.core
    fan_metric: gpu.0.fan_speed
    core_threshold: 80.0
    fan_below: 70.0
    core_clear: 77.0 # core がこれ未満になったら解除する
    fan_clear: 73.0 # fan がこれ以上になったら解除する
    fire_after_s: 30.0

  # 決定記録 0145: 12V-2x6 コネクタの外装温度（T_SENSOR。0110）を 2 段で知らせる（値は provisional）。
  # 0110 の Critical Safety（80 °C で EMERGENCY・全 zone Max）より前に、人が負荷を止められるように。
  # 値は coldaisle-telemetry が DB へ書いた hwmon の最新値を、評価のたびに読む（基板のサンプルに含まれない）。
  # 比較は「以上」（成立は値 >= threshold、解除は値 < clear）。最新値が無い・ok でない
  # （stale は config/quality.yaml の stale_after_ms・0 °C 未満の断線は suspect）周期は評価しない
  # （発火待ちは取り消し、発火中は保つ。0131 §2.3 と同じ。0139 は当てない）。
  # 実測は GPU 600 W の定常で 48〜51 °C（docs/fan-header-mapping.md の T5・T7）

  # 警告。夜間は届かない（config/notify.yaml の night.warning_enabled。0135 §2.3）
  connector_temp_high:
    enabled: true
    severity: warning
    metric: board.connector_12v2x6
    threshold: 65.0
    clear: 62.0
    fire_after_s: 60.0

  # 重大。80 °C（safety.yaml の telemetry.t_sensor.absolute_ceiling_c）の手前。
  # 10 s は 2.5 s 周期の 4〜5 回の読み値（1 回の読み違いで鳴らさない。0145 §2.2）
  connector_temp_critical:
    enabled: true
    severity: critical
    metric: board.connector_12v2x6
    threshold: 75.0
    clear: 72.0
    fire_after_s: 10.0

# MockSource のシナリオ定義（#6）
#
# **シナリオはここだけで定義します。** コードに分岐を足さないでください。
# 新しい状況を作るときは、下の4種類の効果（effects）の組み合わせで書きます。
# 表現できない状況が出てきたら、効果の種類を足して両方をレビューします。
#
# 同じ `seed` なら出力は完全に一致します（受入基準）。時間圧縮（speed）を
# 変えても値は変わりません。速度は待ち時間だけに効きます。

defaults:
  interval_ms: 2500 # 要件の送信周期
  duration_s: 600 # null なら無限に流し続ける
  seed: 20260824
  baseline:
    room_c: 26.0
    room_humidity_pct: 48.0
    noise_c: 0.05 # ガウスノイズの標準偏差。DS18B20 の 11bit 分解能（0.0625℃）より小さい
    noise_pct: 0.2
    # 室温からの定常オフセット。要件 §5.1 の「各部 +1〜3℃」
    offsets_c:
      front_intake: 1.4
      gpu_intake: 1.8
      gpu_exhaust: 2.4
      top_exhaust: 0.6
      rear_exhaust: 1.0

scenarios:
  idle:
    description: 室温26℃前後、各部+1〜3℃、微小なノイズ。異常なし
    duration_s: null # デーモンの動作確認用に終わらせない

  ramp:
    description: GPU負荷の上昇。gpu_exhaust が10分で+15℃
    effects:
      - kind: drift
        channel: gpu_exhaust
        start_s: 0
        end_s: 600
        delta_c: 15.0
      - kind: drift # 吸気も予熱される。排気ほどは上がらない
        channel: gpu_intake
        start_s: 0
        end_s: 600
        delta_c: 4.0

  recirculation:
    description: 排気の再循環。front_intake が room から徐々に離れる
    duration_s: 900
    effects:
      # d.intake_rise = front_intake - room が 1.4℃ から 7.4℃ へ。
      # FR-404 の閾値 5.0℃ を 300秒時点で超え、以降10分間そのままになる
      - kind: drift
        channel: front_intake
        start_s: 60
        end_s: 300
        delta_c: 6.0

  sensor_fail:
    description: rear_exhaust が120秒目から欠測になる（契約どおりの故障）
    effects:
      # **これが実機の既定の振る舞い。** ファーム（#11）は DS18B20 の -127.00 を
      # `null` + `err` に変換して送る（決定記録 0003 のフィクスチャ）。
      # MockSource の役割は「実機が送ってくるもの」の再現なので、こちらを既定にする。
      # 生値がそのまま届く場合は sensor_fail_raw / sensor_reset_85 で試す。
      - kind: stuck_value
        channel: rear_exhaust
        start_s: 120
        value: null
        err: "rear_exhaust:-127"

  sensor_fail_raw:
    description: rear_exhaust が120秒目から -127.00 の生値を返す（契約違反のファーム）
    effects:
      # ファームのバグや旧版では、変換されずに生値が届きうる。**err も付かない。**
      # そのときホストが -127℃ を黙ってダッシュボードへ出さないこと（要件 §5.3）を
      # 確かめるための入力。err を付けると「デバイスが教えてくれる」前提になり、
      # 防御的パースの試験にならない
      - kind: stuck_value
        channel: rear_exhaust
        start_s: 120
        value: -127.0

  sensor_reset_85:
    description: rear_exhaust が300秒目から ちょうど 85.00 を返す（-127 より危険）
    effects:
      # DS18B20 のパワーオンリセット値（spec-review C-02）。変換完了前に読む、
      # あるいは電源が瞬断すると出る。**-127.00 は誰が見ても異常だが、
      # 85.00 は排気温度としてありえなくはない値なので、ダッシュボードで本物に見える。**
      # 測定範囲（-55〜125℃）にも収まるため、範囲検査では捕まらない。
      # 番兵値として名指しで弾いていることの実データ試験になる
      - kind: stuck_value
        channel: rear_exhaust
        start_s: 300
        value: 85.0

  reset:
    description: 300秒目にデバイスが再起動。up が巻き戻り seq が 0 に戻る
    effects:
      - kind: device_reset
        at_s: 300

  dropout:
    description: 200秒目から30秒間、ホストにデータが届かない
    effects:
      # デバイスは動き続けているので seq は進む。受信側で見ると seq が飛ぶ。
      # これが FR-105（取りこぼし検出）の試験入力になる
      - kind: dropout
        start_s: 200
        end_s: 230

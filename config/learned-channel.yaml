# coldaisle-fand と Learned worker（Learned MPC / RL Supervisor）の経路の設定（#86 / 決定記録 0077 §2.7）
#
# coldaisle-fand が役割ごとの SOCK_SEQPACKET の Unix ソケットで待ち受け、worker が接続します。
# worker から受け取るのは提案（MpcProposal）と heartbeat だけで、coldaisle-fand から送るのは
# 毎 tick の frame だけです。worker の提案が出せるのは requested まで（Reactive Guard と
# Critical Safety は迂回できません）。
#
# **制御の閾値ではなく経路の形だけを持ちます。** safety.yaml にも、Control Config の4ファイル
# （fan-hardware / safety / fan-policy / air-balance）にも入れません。
# coldaisle-fand は `--learned-channel-config` で与えたときだけ読みます（省くと経路を開きません）。
# 不正・ソケットを開けない・グループを解決できない・2つのグループに同じ uid が属するときは、
# 経路を開かずに Fallback / RulePolicy で運転を続けます（decision trace の detail に channel_disabled）。
#
# 配置の必須条件（0077 §2.7）:
# - 役割ごとに専用のグループを作り、2つのグループに同じ uid を入れない（起動時と接続ごとに確かめます）
# - coldaisle-fand と同じ uid・root は暗黙には認めません（グループに入れなければ接続できません）
# - 読み取り API・AI 層・coldaisle-eventd の実行ユーザーを worker のグループに入れない（ルール1）

version: 1

sockets:
  # 規則は control-admin.yaml と同じ（0045 §2.2 / 0072 §2.5）。本番は systemd の RuntimeDirectory 配下を
  # 指定します。other が書ける親ディレクトリ、ソケット以外の既存ファイル、既に応答するソケットでは開きません。
  # **group の値は仮の名前です。** 配置先で作った専用グループ名に置き換えてください（null は不可）。
  # **親ディレクトリは役割ごとに分けます**（決定記録 0095）。親は役割のグループで 0750 として作られ、
  # 共通の親にすると、もう一方の役割のグループがたどれずに経路全体を開けません。
  # **共通の祖先（開発では var/run、本番では systemd の RuntimeDirectory）は起動前に用意し、両方の役割の
  # グループがたどれる（g+x か o+x）ようにしてください。** 無い祖先は最初に待ち受ける役割のグループで 0750 として
  # 作られ、もう一方がたどれなくなります（決定記録 0095 §2.7）。本番は /run/coldaisle/learned-mpc/mpc.sock と
  # /run/coldaisle/learned-rl/supervisor.sock で、親は deploy/tmpfiles.d/coldaisle-learned.conf が setgid（2750）で作ります。
  # coldaisle-fand の実行ユーザーを役割のグループに入れないでください（重なりの検査で経路が開きません。決定記録 0115）。
  mpc:
    path: var/run/learned-mpc/mpc.sock
    mode: "0660"
    group: coldaisle-learn-mpc
  supervisor:
    path: var/run/learned-rl/supervisor.sock
    mode: "0660"
    group: coldaisle-learn-rl

limits:
  # 1メッセージ（両方向）の上限バイト数。超えた提案は受け取らずに捨て、超えた frame は送らずに捨てます。
  max_message_bytes:
    value: 65536
    status: provisional
    basis: "決定記録 0077 §5（実測を待つ値）。段階 1 の試験用の設定で frame は約 6 KB。10 倍の余裕を取った暫定値"
  # listen() の待ち行列。同時に持つ接続は役割ごとに1つ（0077 §2.7）で、これはその手前の待ち行列です。
  listen_backlog: 4
  # Workload Hint の B1 の Shadow の記録1件の上限バイト数（#288 / 決定記録 0133 §2.5）。max_message_bytes 以下。
  # 超えた記録は切り詰めずに捨てます（worker は shadow_record_too_large に数え、fand の受信側も同じ上限で検査します）。
  # 下の packet_overhead_bytes と組で置きます（片方だけは不正）。
  max_shadow_record_bytes:
    value: 32768
    status: provisional
    basis: "決定記録 0133 §2.5（horizon と offset の数から見積もる値）。両 plan の予測の全 offset で数 KB の見積もりに余裕を取った暫定値"
  # 1メッセージあたりのカーネルの管理領域の見積もり。MPC worker は送信バッファ（SO_SNDBUF）を、ヒントを扱わないときの値に
  # max_shadow_record_bytes + packet_overhead_bytes を足した値にします（基準の提案と heartbeat の空きを減らさない）。
  packet_overhead_bytes:
    value: 8192
    status: provisional
    basis: "決定記録 0133 §2.5（実測で決める値）。開発機（Linux 7.0）で 32768 B の記録の SIOCOUTQ が 37120 B（余分 4352 B）。2倍に近い余裕を取った暫定値。本番のホストで測り直す"

# worker が提案・失敗を送らない間も heartbeat を送る間隔（ミリ秒）。接続を認めた最初の応答で worker へ知らせます。
heartbeat_interval_ms:
  value: 1000
  status: provisional
  basis: "決定記録 0077 §5（実測を待つ値）。safety.yaml の tick_ms と同じ桁の暫定値"

# 最後の有効なメッセージ（提案・失敗・heartbeat）からこの時間黙った接続を閉じます（worker_idle）。
# **heartbeat_interval_ms の3倍以上**（読み込み時に確かめ、満たさなければ経路を開きません）。
worker_idle_timeout_ms:
  value: 5000
  status: provisional
  basis: "決定記録 0077 §5（実測を待つ値）。heartbeat を4回取りこぼすまで待つ暫定値"

# Workload Hint の B1（shadow_mpc）で coldaisle-fand が行う認証領域の判定の値（#288 / 決定記録 0162 §2.2）。
# fand が読み、frame の hint_certification で MPC worker へ渡します（worker は自分の設定では比べません）。
# 証明書には束ねません（解の結果に効かず、判定を厳しくする向きにしか働かないため）。
# この塊を省くと、fand は frame にヒントの欄を入れません（B1 が動かないだけで、基準の経路は変わりません）。
hint_domain:
  # fand が自分の送った frame で判定する区間の長さ（ミリ秒）。区間とその直前の 1 frame のすべてが
  # 認証領域の中であることを確かめます。**artifact の window_ms 以上にします**（短いと worker が解きません）。
  domain_lookback_ms:
    value: 600000
    status: provisional
    basis: "決定記録 0162 §2.2（実測を待つ値）。artifact の window_ms がまだ無いので、それを覆う側の暫定値"
  # fand の古さの閾値（ミリ秒）。区間の各 frame の軸の metric で「次の frame の時刻 − source_ts_ms」が
  # これ以上なら範囲の外にします。**artifact の stale_after_ms 以下にします**（長いと worker が解きません）。
  domain_stale_after_ms:
    value: 10000
    status: provisional
    basis: "決定記録 0162 §2.2（実測を待つ値）。config/quality.yaml の stale_after_ms と同じ桁の暫定値"

# Learned MPC worker の Shadow solver の子プロセス（#288 / 決定記録 0133 §2.5・0162 §2.5 の PR-B）。worker だけが読みます。
# 子は SCHED_IDLE で動き、基準の solve と送信を待たせません。この塊を省くと worker は子を作りません
# （ヒントの依頼を解かないだけで、基準の経路は変わりません）。置くときは limits の max_shadow_record_bytes と
# packet_overhead_bytes も要ります。
hint_shadow:
  # 子が死んだ・応答しない・経路が壊れたとき、作り直すまでにあける間隔（ミリ秒）。
  # SCHED_IDLE に下げられない子は作り直しません（そのプロセスの間は Shadow solver を使いません）。
  respawn_interval_ms:
    value: 30000
    status: provisional
    basis: "決定記録 0133 §2.5（実測を待つ値）。子の起動時の指紋の計算（数秒）を繰り返し続けない間隔の暫定値"
  # 依頼の打ち切り時刻からこの時間たっても結果が来ない子を「応答しない」として終わらせます（ミリ秒）。
  # 子は SCHED_IDLE なので CPU が空かない間は遅れて当然です。短すぎると飢えているだけの子を作り直し続けます。
  unresponsive_after_ms:
    value: 60000
    status: provisional
    basis: "決定記録 0133 §2.5（実測を待つ値）。mpc.period_ms の数周期分を待つ暫定値"

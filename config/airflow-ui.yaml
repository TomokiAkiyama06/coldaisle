# エアフロー画面（#106 / 決定記録 0046）の表示設定
#
# **表示専用。** 制御・アラートの閾値ではない（Fan 制御は config の safety / fan-policy、
# アラートは rules.yaml が持つ）。ここを変えても色の付き方が変わるだけ。
# `GET /api/v1/airflow/config` がそのまま返す。

version: 1

air_temperature:
  # 風の矢印と測定点の枠に付ける色の区切り（℃）。狭義の昇順で4つ → 5段階
  #   〜27 青 / 27–28 / 28–29 琥珀 / 29–30 / 30〜 赤
  # 境目ちょうどの値は上の段に入る（27.0 は 27–28）。
  # 仮の値（デザインの初期値）。#50 の実測が出たら見直す
  thresholds_c: [27.0, 28.0, 29.0, 30.0]
  provisional: true

control_trace:
  # 制御の判断記録（decision trace）を画面が「古い」と言う境目（決定記録 0071 §2.6 / §5 #1）。
  # `GET /api/v1/control/latest` の `age_ms` が、その trace 自身の `runtime.tick_period_ms`
  # （v8 以降）のこの倍を超えたら「古い」と出す。v1〜v7 は周期を持たないので判定しない。
  # 1 より大きい有限の値（1 以下だと、周期どおりに記録していても毎回「古い」になる）。
  # 仮の値。tick の書き込みの遅れ（締め切り・保存）と画面の読み出しの間隔を見込み、
  # 止まった制御デーモンを数周期で「古い」と言えるよう小さめに置いた。実運用で見直す
  stale_after_tick_periods: 3.0
  provisional: true

# ハードウェア故障疑いの引き上げ（FR-509 / #39）
#
# ############################################################################
# **coldaisle は送信しません。**
#
# 案件資料をファイルに書き、「できた」と知らせるだけです。読んで、必要と
# 判断したら**人が** Claude へ渡してください（決定記録 0019 §2.1）。
#
# **判定に LLM を使いません。** 同じ入力からは必ず同じ結果が出ます（受入基準）。
# ############################################################################
#
# `coldaisle-escalate` を cron から1日1回、`coldaisle-rollup` のあとに呼びます。
#
#   0 3 * * *  uv run coldaisle-rollup
#   10 8 * * * uv run coldaisle-escalate

timezone: "Asia/Tokyo"
output_dir: "var/escalations"

# 知らせの宛先（`coldaisle.report.send` と同じ名前）。空なら知らせません
to: [stdout]

# 経過に載せる日数。**生の時系列は載せません**（受入基準）
course_days: 14

# 案件資料の上限。超えたら切り、切ったことを書きます
max_chars: 4000

triggers_note: >
  引き金は3つです。どれも「1回で騒がない」ように、継続を条件にしています。

# 段階的でない急変が続いている（例: サーマルパッド劣化）
step_change:
  enabled: true
  metric: d.gpu_internal_delta
  # 隣り合う日の平均がこれ以上動いたら「急変」とみなす
  delta: 8.0
  # その水準がこれだけ続いたら引き上げる
  hold_days: 3
  question: |
    サーマルパッド/グリスの劣化か、温度センサー自体の異常か、RMA 相当か。
    吸気温は「試行済み」に測定値がある。**負荷パターンとファン回転数は
    coldaisle では測っていない**ので、そちらの確認は人が行う必要がある。

# ベースラインからの持続的逸脱
sustained_deviation:
  # ##########################################################################
  # **ベースライン測定（#19）が終わるまで false のままにすること。**
  #
  # `baseline` は実測していない値です。いまの値で有効にすると、正常な運転を
  # 「逸脱」として毎日引き上げます。閾値を実測で確定してから true にします。
  # ##########################################################################
  enabled: false
  metric: d.gpu_delta
  baseline: 10.0
  tolerance: 5.0
  hold_hours: 12
  question: |
    GPU が与える熱の量がベースラインから外れ続けている。
    冷却性能の低下か、負荷の質が変わったか、センサーのドリフトか。

# 同じ critical が繰り返し出る（対処が効いていない）
repeated_critical:
  enabled: true
  min_count: 3
  window_days: 7
  question: |
    同じ critical が繰り返し出ている。ルールの閾値が実態に合っていないのか、
    ハードウェア側に未解決の原因があるのか。

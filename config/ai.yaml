# ローカルLLM の設定（FR-501 / #21）
#
# **接続先とモデル名は環境変数から読みます**（`.env`）。ここには書きません。
#   OPENAI_BASE_URL   例: http://127.0.0.1:11434/v1（Ollama） / http://127.0.0.1:8001/v1（vLLM）
#   MODEL_NAME        例: qwen3.8:27b
#   OPENAI_API_KEY    ローカルでは不要。vLLM に鍵を設定した場合のみ
#
# 環境変数を変えるだけでバックエンドが切り替わること（受入基準）を保つため、
# このファイルに接続先を書かないでください。

# 1リクエストの待ち時間。思考モードは長くなるので別に持つ
timeout_s: 30.0
thinking_timeout_s: 120.0

# 落ちている相手に粘らない。**LLM が不達でも監視は動き続ける**（FR-507）ので、
# 待たせるより早く「利用不可」と答えるほうがよい
max_attempts: 2
retry_backoff_s: 0.5

# Server Health の任意要約に失敗したあと、バックグラウンド再試行まで待つ時間。
# API 応答は待たずに固定テンプレートを返すため、この値は監視の可用性に影響しない
health_summary_retry_s: 60.0

# 生成の既定値。呼び出し側で上書きできる
temperature: 0.2
max_tokens: 1024

# 思考モードの既定。日常のQ&Aは非思考で低レイテンシ、診断時は呼び出し側で有効化する
thinking: false

# 思考の指示を `chat_template_kwargs.enable_thinking` として送るか。
# **Qwen3 系 + vLLM の作法**であり、対応しないバックエンドでは 400 になりうる。
# 導入時にスモークテストで確かめること（決定記録 0014 §2.3）
send_thinking_flag: true

# アラートに Evidence 形式の説明を後追いで付けるか（#38 / FR-508）。
# **生成は通知経路をブロックしません。** 失敗したら素のアラートだけが届きます
explain_alerts: true

# アラートの説明に足す、負荷と温度の直近の集計（決定記録 0143 §2.11）。
# **平均・最大・傾きだけを渡す。生の時系列は渡さない**（ルール 8）。
# LLM へ渡さない一覧（config/report.yaml の llm_excluded_*。0131 §2.4a / 0138）に当たるメトリクスは、
# ここに書いても材料にならない（gpu.*.fan_speed / gpu.*.fan_policy などは書かない）。
# Provider に依らない（ローカル LLM でも Claude でも同じ材料）
explain_context:
  # 説明は発火の直後に作るので、直近の窓で発火の前後を見る
  window: 15m
  metrics:
    - gpu.0.utilization
    - power.gpu.0
    - gpu.0.core
    - cpu.utilization
    - power.cpu.package
    - cpu.package
    - air.room
    - air.front_intake
    - air.gpu_intake
    - air.gpu_exhaust
    - air.top_exhaust
    - air.rear_exhaust

# --------------------------------------------------------------------------
# Claude API を使うときの上限（決定記録 0143 §2.5 / #324）
#
# **ローカル LLM が導入先に入るまでの間だけの代わり。** 使うのは環境変数で
# `COLDAISLE_LLM_PROVIDER=anthropic` と明示したときだけ（既定は上の OpenAI 互換のまま）。
# 鍵（ANTHROPIC_API_KEY）とモデル ID（ANTHROPIC_MODEL）は環境変数から読み、ここには書かない。
#
# 上限に達したら**呼ばずに**「利用不可」を返す。所見・説明が付かないだけで、監視と通知は動く（FR-507）。
anthropic:
  # 1 回の応答の上限。上の max_tokens と小さいほうを送る
  max_tokens: 1024
  # 1 プロセス・1 日（ローカル時刻の日付）あたりの HTTP 要求の回数。再試行も 1 回と数える。
  # daemon（アラートの説明）・report（日次レポート）・API（`coldaisle.server:app` で起動したときの
  # Server Health の要約）がそれぞれ数える。
  # プロセスの中で数えるので再起動で 0 に戻る。**課金の正本は Anthropic の Console の spend limit**
  daily_call_limit: 200
  # output_config.effort（low / medium / high）。**null なら送らない**（モデルの既定のまま）。
  # 対応するモデルかをコードで判定しないので、対応を確かめたモデルでだけ設定する（0143 §2.5）
  effort: null

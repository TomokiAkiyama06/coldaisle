# ローカルLLM の設定（FR-501 / #21）
#
# **接続先とモデル名は環境変数から読みます**（`.env`）。ここには書きません。
#   OPENAI_BASE_URL   例: http://127.0.0.1:11434/v1（Ollama） / http://127.0.0.1:8001/v1（vLLM）
#   MODEL_NAME        例: qwen3.8:27b
#   OPENAI_API_KEY    ローカルでは不要。vLLM に鍵を設定した場合のみ
#
# 環境変数を変えるだけでバックエンドが切り替わること（受入基準）を保つため、
# このファイルに接続先を書かないでください。

# 1リクエストの待ち時間。思考モードは長くなるので別に持つ
timeout_s: 30.0
thinking_timeout_s: 120.0

# 落ちている相手に粘らない。**LLM が不達でも監視は動き続ける**（FR-507）ので、
# 待たせるより早く「利用不可」と答えるほうがよい
max_attempts: 2
retry_backoff_s: 0.5

# Server Health の任意要約に失敗したあと、バックグラウンド再試行まで待つ時間。
# API 応答は待たずに固定テンプレートを返すため、この値は監視の可用性に影響しない
health_summary_retry_s: 60.0

# 生成の既定値。呼び出し側で上書きできる
temperature: 0.2
max_tokens: 1024

# 思考モードの既定。日常のQ&Aは非思考で低レイテンシ、診断時は呼び出し側で有効化する
thinking: false

# 思考の指示を `chat_template_kwargs.enable_thinking` として送るか。
# **Qwen3 系 + vLLM の作法**であり、対応しないバックエンドでは 400 になりうる。
# 導入時にスモークテストで確かめること（決定記録 0014 §2.3）
send_thinking_flag: true

# アラートに Evidence 形式の説明を後追いで付けるか（#38 / FR-508）。
# **生成は通知経路をブロックしません。** 失敗したら素のアラートだけが届きます
explain_alerts: true

# アラートの説明に足す、負荷と温度の直近の集計（決定記録 0143 §2.11）。
# **平均・最大・傾きだけを渡す。生の時系列は渡さない**（ルール 8）。
# LLM へ渡さない一覧（config/report.yaml の llm_excluded_*。0131 §2.4a）に当たるメトリクスは、
# ここに書いても材料にならない（0146 で一覧は空。GPU の Fan の値も読める）。
# Provider に依らない（ローカル LLM でも Claude でも同じ材料）
explain_context:
  # 窓は発火の時刻で終わる（説明が遅れても発火の前の状態を見る）
  window: 15m
  metrics:
    - gpu.0.utilization
    - power.gpu.0
    - gpu.0.core
    - gpu.0.fan_speed    # NVML の目標値の %（実回転ではない）。0146 で LLM が読める
    - cpu.utilization
    - power.cpu.package
    - cpu.package
    - air.room
    - air.front_intake
    - air.gpu_intake
    - air.gpu_exhaust
    - air.top_exhaust
    - air.rear_exhaust

# --------------------------------------------------------------------------
# Claude API を使うときの上限（決定記録 0143 §2.5 / #324）
#
# **ローカル LLM が導入先に入るまでの間だけの代わり。** 使うのは環境変数で
# `COLDAISLE_LLM_PROVIDER=anthropic` と明示したときだけ（既定は上の OpenAI 互換のまま）。
# 鍵（ANTHROPIC_API_KEY）とモデル ID（ANTHROPIC_MODEL）は環境変数から読み、ここには書かない。
#
# 上限に達したら**呼ばずに**「利用不可」を返す。所見・説明が付かないだけで、監視と通知は動く（FR-507）。
anthropic:
  # 1 回の応答の上限。上の max_tokens と小さいほうを送る
  max_tokens: 1024
  # 1 プロセス・1 日（ローカル時刻の日付）あたりの HTTP 要求の回数。再試行も 1 回と数える。
  # daemon（アラートの説明）・report（日次レポート）・API（`coldaisle.server:app` で起動したときの
  # Server Health の要約）がそれぞれ数える。
  # プロセスの中で数えるので再起動で 0 に戻る。**課金の正本は Anthropic の Console の spend limit**
  daily_call_limit: 200
  # output_config.effort（low / medium / high）。**null なら送らない**（モデルの既定のまま）。
  # 対応するモデルかをコードで判定しないので、対応を確かめたモデルでだけ設定する（0143 §2.5）
  effort: null

# --------------------------------------------------------------------------
# Slack のメンションへの返答（coldaisle-slackbot。決定記録 0168 / #374）
#
# **この経路だけの上限**で、日次レポート・アラートの説明の上限（上の anthropic:）を食わない（0168 §2.5）。
# この塊が無ければ coldaisle-slackbot は起動しない。答えるのは許可リスト（COLDAISLE_SLACK_QA_CHANNELS /
# COLDAISLE_SLACK_QA_USERS。環境変数）の両方に当たるメンションだけ（0168 §2.2）。
# LLM に渡すツールは get_latest / get_stats / list_alerts / describe_system の 4 つだけ（0168 §2.3。ここでは変えない）。
slack_qa:
  # 1 プロセス・1 日（ローカル時刻の日付）あたりの LLM の呼び出しの回数。tool loop の 1 往復を 1 回と数える。
  # 上限に達したら呼ばずに「いま AI が使えません」の固定の文を返す
  daily_call_limit: 100
  # 1 つの質問で、ツールの呼び出しを返す応答を受ける回数の上限。超えたらツール無しで答えさせる（0168 §5 の 3）
  max_round_trips: 4
  # 1 回の応答で実行するツールの数の上限。超えた分は実行せずにエラーの結果を返す
  max_tool_calls_per_round: 8
  # 1 つの質問で実行するツールの呼び出しの合計の上限（0168 §2.3）。超えた分は実行せずにエラーの結果を返す
  max_tool_calls_per_question: 16
  # 1 ユーザーが user_window_s 秒の間に聞ける質問の数。超えたら「少し待ってください」と返す（0168 §2.5）
  user_questions_per_window: 3
  user_window_s: 60.0
  # LLM へ送る質問文の長さの上限（超えた分は送らない）
  max_question_chars: 1000
  # 1 つのツールの結果（JSON）を LLM へ送る長さの上限
  max_tool_result_chars: 16000
  # 1 投稿の長さの上限（0168 §2.4。3000 まで）
  max_reply_chars: 3000
  # 答えを作る待ち行列の長さ。溢れたメンションには答えない（受信と ack は止めない）
  queue_size: 8
  # Socket Mode が切れたときに、つなぎ直すまで待つ時間。失敗が続くと倍にし、上限で止める
  reconnect_initial_s: 2.0
  reconnect_max_s: 300.0
  # この秒数 Slack から何も受けなければ（hello・event・disconnect のどれも）、apps.connections.open から
  # 新しい URL を取り直してつなぎ直す（0168 §2.1。Slack は接続を数時間ごとに入れ替え、警告が届かないこともある）。
  # **provisional。** WebSocket の ping / pong（websockets の keepalive、約 20 s ごと）は数えないので、
  # 静かなワークスペースではこの間隔でつなぎ直す。ping の間隔より十分長くとる
  idle_reconnect_s: 900.0

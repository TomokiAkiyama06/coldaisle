# 書き込み専用のローカル Unix ソケット入口（coldaisle-eventd）の設定（#67 / 決定記録 0045）
#
# 読み取り API とは別の入口です。TCP では待ち受けません。
# 本番では専用ユーザーで動かし、ソケットを 0660 + 専用グループにして、
# 書いてよい利用者だけをそのグループへ入れます。読み取り API / AI サーバを
# 動かすユーザーはグループに入れません（決定記録 0045 §2.2 / §2.7）。

version: 1

socket:
  # 相対パスは作業ディレクトリ基準。本番は systemd の RuntimeDirectory 配下を指定する。
  # 親ディレクトリが無ければ 0750 で作り、group があればそのグループにする
  # （実行ユーザーがそのグループに属している必要がある）。
  # other が書ける親ディレクトリでは起動しない。
  # group を指定したときは、ルートから親までの各ディレクトリを書き手がたどれること
  # （グループが一致して g+x、または o+x）を起動時に確かめ、満たさなければ起動しない。
  # 既にあるディレクトリの権限は変えないので、足りなければ手で直す。
  # また、そのときは途中にシンボリックリンクを含むパスでは起動しない
  # （リンク先の経路までは確かめきれないため）。リンクを含まない実体のパスを書く。
  path: var/run/coldaisle-events.sock
  # 8進の文字列で書く（YAML の 0660 は解釈が揺れるため）。
  # other のビットを含む値（例: "0666"）と setuid / setgid / sticky は起動時に拒否する。
  mode: "0660"
  # 専用グループ名。ソケットと、入口が作った親ディレクトリをこのグループにする。
  # null ならグループを変えず、親をたどれるかも確かめない（開発用）。
  group: null

authorization:
  # サーバと同じ uid の接続を認める。同じ uid は DB ファイルを直接書けるため、
  # ここで拒否しても守りにはならない（決定記録 0045 §2.3）。
  allow_same_user: true

limits:
  # 1行（1メッセージ）の上限バイト数。超えたら拒否して切断する。
  max_message_bytes: 4096
  # 1接続が1行を送り切るまでの上限秒数。遅い接続で入口を塞がせない。
  read_timeout_s: 2.0

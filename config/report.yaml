# 日次レポート（FR-506 / #25）
#
# `coldaisle-report` を cron から毎朝呼びます。**`coldaisle-rollup` のあとに**
# 走らせてください。集計元は1分ロールアップなので、前日ぶんが埋まっている必要が
# あります（決定記録 0017 §2.1）。
#
#   0 3 * * *  cd /path/to/coldaisle && uv run coldaisle-rollup
#   5 8 * * *  cd /path/to/coldaisle && uv run coldaisle-report

# 日の境界に使うローカル時刻
timezone: "Asia/Tokyo"

# ファイルには保存しません（決定記録 0171 §2.4。0017 §2.4 の `var/reports` を置き換え）。
# 読みたいときは `coldaisle-report --date <日> --no-send --print` で標準出力へ出します。

# 宛先の名前。空にすると送りません。
# **`Router` は通しません**（連投の抑制・夜間の方針はアラートの都合）
to: [stdout]

# AI に所見（2〜3文）を書かせるか。**失敗しても表だけで成立します**
summarise: true

# LLM へ渡さないメトリクスとアラート（決定記録 0131 §2.4a の仕組み。0146 §2.2 が引き継ぐ）。
#
# 日次レポートの所見の入力・取り込みのアラートの説明・AI ツールの窓口・Server Health の
# AI 要約・案件資料が、**この1か所**を読みます（2 か所に持たない）。人が読む本文・通知・
# API の決定論的な応答からは除きません。件数・時刻・欠けの注記など LLM へ渡す派生の値は、
# この一覧を当てた後の集合から作ります。
#
# メトリクスは名前のパターン（`*` は何にでも一致）、ルールは rule_id で書きます。
# **どちらのキーも省略できません。** 形が不正なら、LLM へ渡す経路を開きません（安全側）。
#
# **今は空です**（除くものが無い）。GPU の Fan の値とアラートは LLM が読むだけ許されています
# （決定記録 0146。書き込み・実行の手段は与えない）。GPU の Fan をここへ書き戻さないでください。
# tests/test_llm_exclusions.py が CI で止めます。変えるときは新しい決定記録を先に作ります。
llm_excluded_metrics: []
llm_excluded_rules: []

# アラートの内訳に載せるルール数の上限
max_alerts: 20

# Webhook・LINE・stdout の 1 通に載せる文字数。長ければ切り、末尾に「…（続きはダッシュボードで）」を
# 付けます（LINE は5000文字で切られる）。Slack の Bot の要点はこれで切りません（決定記録 0171 §2.2）
max_notification_chars: 3500

# Slack の Bot（`COLDAISLE_SLACK_BOT_TOKEN` / `COLDAISLE_SLACK_CHANNEL`）で送るときの親の題（決定記録 0171）。
#
# チャンネルにはこの題だけを送り、レポートの本文はそのスレッドへ返します。`{month}` と `{day}` に
# 対象日の月と日が 0 埋めせずに入ります（年は付けません）。Webhook だけのとき・LINE・stdout では
# 使いません（今までどおり 1 通）。
thread_title: "📄 {month}月{day}日の振り返り"

# Slack の Bot のスレッドの要点（返信 1）の「主な値」に最高値を載せる metric（決定記録 0171 §2.2）。
# その日の値が無いものは書きません。`config/metrics.yaml` に無い名前は起動時に落ちます。
highlight_metrics:
  - air.room
  - gpu.0.core
  - cpu.package
  - board.connector_12v2x6
  - power.gpu.0
  - power.cpu.package

# 測定値の表の画像（返信 2）に使う日本語のフォントのファイル（決定記録 0171 §2.3）。
# 既定は Ubuntu の `fonts-noto-cjk` の場所です。ファイルが無い・読めないときは表を Markdown の文で送ります。
table_font: "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
table_font_size: 28

# 秘匿情報の混入検出（#41）
# pre-commit と同一の設定を CI でも走らせ、フック未導入の環境からの push を拾う。
# lint / mypy / pytest は #2 の ci.yml が担当する。
name: secrets

on:
  pull_request:
  # push は main に限定しない。
  # 「main に直接コミットしない」運用（AGENTS.md）では main への push はマージ時にしか
  # 起きず、その時点で内容はすでに public remote に載っている。
  # PR を開かないブランチや PR を開く前の push を取りこぼさないよう、全ブランチで走らせる。
  push:

# 同一 ref への連続 push で無駄に多重起動しないようにする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

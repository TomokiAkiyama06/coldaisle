# coldaisle-fand と Learned worker の役割ごとのソケットのディレクトリ（#57 / 決定記録 0115 §2.2）のテンプレート。
#
# **テンプレートである。** ユーザー名・グループ名・path は仮の値。導入先の /etc/tmpfiles.d/ に置き、
# `systemd-tmpfiles --create` で作る。OS の再起動のたびに systemd-tmpfiles-setup.service が作り直す（fand より前）。
#
# - /run/coldaisle の行は coldaisle-fand の unit の User= / Group= / RuntimeDirectoryMode= と**同じ値**にする。
#   食い違うと systemd が RuntimeDirectory= の中身ごと所有者を付け替え、下の役割のグループが失われる
#   （そのときは fand が channel_disabled で Learned を使わないだけ。0077 §2.7）
# - 役割のディレクトリは setgid（2750）。fand が作ったソケットは作った時点で役割のグループを持つので、
#   **fand を worker のグループに入れずに済む**（入れると 0077 §2.7 の重なりの検査で経路が開かない）
# - other に何も無いので、RL のユーザーは MPC のソケットの手前までたどれない（役割の境界を権限でも分ける）
# - グループ coldaisle-learn-rl は RL worker を動かさない間も要る（fand は2つの役割のソケットを必ず両方開く）。
#   グループが無いとこのファイルの適用が失敗する
#
# 型 path                         mode 所有者        グループ             age
d /run/coldaisle                  0711 coldaisle-fan coldaisle-fan        -
d /run/coldaisle/learned-mpc      2750 coldaisle-fan coldaisle-learn-mpc  -
d /run/coldaisle/learned-rl       2750 coldaisle-fan coldaisle-learn-rl   -

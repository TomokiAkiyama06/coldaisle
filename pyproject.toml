[project]
name = "coldaisle"
version = "0.1.0"
description = "GPUサーバーの温湿度監視 + ローカルLLM運用アシスタント"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi",
    # WebSocket ライブ配信（FR-306）に websockets が必要なため standard を指定する
    "uvicorn[standard]",
    "pyserial",
    # 要件 §9 は Pydantic v2 の API を前提にしている
    "pydantic>=2.12",  # Field(exclude_if=...) を使う（control/schema.py）
    "pyyaml",
    "httpx",
    # GPU Telemetry は nvidia-smi を spawn せず NVML を直接読む（#65）
    "nvidia-ml-py>=13",
    # 日次レポートの測定値の表の画像だけに使う（coldaisle.report_table。決定記録 0171 §2.3）。
    # 取り込み・API・fand・Learned からは import しない
    "pillow>=12,<13",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # デバイス出力 JSON スキーマ（schemas/device_v1.schema.json）の検証に使う。#4
    "jsonschema",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20260815",
    # pyserial は型情報を同梱していない。SerialSource（#12）を mypy --strict で通すため
    "types-pyserial",
]

[project.scripts]
# 実機なしで起動できること（AGENTS.md のコマンド一覧）
coldaisle-daemon = "coldaisle.daemon:main"
# ロールアップと削除。cron / systemd タイマーから呼ぶ（#10）
coldaisle-rollup = "coldaisle.rollup_job:main"
# 日次レポート。cron から毎朝、ロールアップのあとに呼ぶ（#25）
coldaisle-report = "coldaisle.report:main"
# 連続運転テスト（soak）の集計。**既存の DB を読むだけ**（#47）
coldaisle-soak-report = "coldaisle.soak:main"
# 負荷の状態ごとの d.* の分布。**DB を読むだけで、合否も閾値の提案も出さない**（#50 / 決定記録 0151）
coldaisle-load-distribution = "coldaisle.load_distribution:main"
# 回転数の掃引と応答の行列の解析。**DB の写しと manifest を読むだけで、設定・DB を書かない**
# （#75 / 決定記録 0153 §2.7 の 2）
coldaisle-airflow-characterization = "coldaisle.airflow_characterization:main"
# 故障疑いの案件資料。**送信はしない**（#39）
coldaisle-escalate = "coldaisle.escalate:main"
# 運用メモリの更新案。**既定では書かない**（#40）
coldaisle-memory = "coldaisle.memory:main"
# 較正オフセットの算出。**既定では書かない**（#13）
coldaisle-calibrate = "coldaisle.calibrate:main"
# Thermal Datasetのwindow/horizonはCLIで必須指定し、実測前の候補を既定値にしない（#83）
coldaisle-dataset = "coldaisle.dataset:main"
# 反実仮想 Thermal Model artifact v2 の学習。**既定では Registry を書かない**。`--apply` のときだけ
# candidate を登録する（production は動かさない）。人が手で実行し、timer から呼ばない（#84 / 決定記録 0150）
coldaisle-train = "coldaisle.train:main"
# Controller 構成の比較レポート。**読み取りだけで、制御へ届かない**（#91 / 決定記録 0054）
coldaisle-evaluate = "coldaisle.evaluate:main"
# Thermal Model の drift 検知と再学習の推奨。**書き込みはしない**（#93 / 決定記録 0056）
coldaisle-drift = "coldaisle.drift:main"
# 保存済み trace から Supervisor の Shadow 集計を作る。**DB と Registry を読むだけで、制御へ届かない**
# （#89 / 決定記録 0074 §2.1）
coldaisle-supervisor-shadow = "coldaisle.supervisor_shadow:main"
# 保存済み trace から Air Balance の協調の shadow 集計を作る。**DB を読むだけで、合否は出さない**
# （#81 / 決定記録 0093）
coldaisle-air-balance-shadow = "coldaisle.air_balance_shadow:main"
# Workload Hint B1 の Shadow の記録の集計。**DB を読むだけで、合否は出さない**（#288 / 決定記録 0162 §2.4）
coldaisle-hint-shadow = "coldaisle.hint_shadow:main"
# Control Model Registry の lifecycle 操作。**読み取りが既定**で、promotion / rollback は
# 人が書いた承認ファイルを要求する（#104 / 決定記録 0062）
coldaisle-registry = "coldaisle.registry:main"
# Authority Stage の昇格と、fand が止まっているときの rollback。**人が自分の uid で実行する**。
# 承認者は実行した uid（引数で受け取らない）。fand / control / API / AI から呼ばない
# （#92 / 決定記録 0072 §2.1 / 0086）
coldaisle-authority = "coldaisle.authority_cli:main"
# Workload Hint の単調性ゲートの認証ランナー。**合格したときだけ --out に証明書を書く**。Registry にも
# 設定にも書かない（登録は人が coldaisle-registry で行う）。本番は `python -I -m coldaisle.hint_certify`
# で起動し、この console script は開発用（-I -m でなければ何もせずに終わる。#288 / 決定記録 0152 / 0157）
coldaisle-hint-certify = "coldaisle.hint_certify:main"
# 反実仮想 Thermal Model の offline 評価。**書くのは --out の報告だけ**（Registry・設定・DB に書かない）。
# 人が手で実行し、timer から呼ばない。gate は助言（#84 / 決定記録 0172）
coldaisle-thermal-evaluate = "coldaisle.thermal_evaluate:main"
# fan daemon 停止後にだけ systemd ExecStopPost から起動する。
# 制御モデル・Safety Config・外部パッケージに依存せず Max しか書かない。
coldaisle-safety-handoff = "coldaisle.safety_handoff:main"
# CPU Package の電力を RAPL から 1 s の平均・1 W の丸めで渡す root のサービス。unit は
# /usr/bin/python3 -I -S でソースを直接動かす。標準ライブラリだけ（#278 / 決定記録 0122）
coldaisle-cpu-power = "coldaisle.cpu_power_publisher:main"
# GPU の Fan を GPU コアの温度の曲線で書く root のサービス（fand の外。NVML を ctypes で呼ぶ）。unit は
# /usr/bin/python3 -I -S でソースを直接動かす。標準ライブラリだけ（#285 / 決定記録 0128）
coldaisle-gpu-fan = "coldaisle.gpu_fan_curve:main"
# NVML / hwmon を既存 readings timeline へ収集する読み取り専用 daemon（#65）
coldaisle-telemetry = "coldaisle.telemetry_daemon:main"
# 3系統 Fan 制御デーモン。**hwmon へ書き込むのはこのプロセスの Backend だけ**（#74 / 0028 §2.2）
coldaisle-fand = "coldaisle.control_daemon:main"
# Learned MPC worker。**fand への提案だけを送り、hwmon・Telemetry・較正ファイルを読み書きしない**
# （#86 / 決定記録 0077 段階 3 / 0101 / 0107）。`--role supervisor` は RL Supervisor worker（#89 / 0077 段階 4）
coldaisle-learnd = "coldaisle.learned_worker.cli:main"
# coldaisle-fand の管理ソケットへ運転モードを送るクライアント。**人が使う**（#74 / 決定記録 0072）
coldaisle-control = "coldaisle.control_admin.client:main"
# 書き込み専用のローカル Unix ソケット入口。読み取り API とは別（#67 / 決定記録 0045）
coldaisle-eventd = "coldaisle.event_entry.server:main"
# 上の入口へ1件送るクライアント（例: coldaisle-event gpu-mode compute）
coldaisle-event = "coldaisle.event_entry.client:main"
# Slack のメンションに読み取り専用のツールで答える常駐のプロセス。**DB は読むだけで、書き込み・実行の
# ツールを持たない**。許可リストのチャンネルかつユーザーにだけ答える（#374 / 決定記録 0168）
coldaisle-slackbot = "coldaisle.slackbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldaisle"]
# ダッシュボードの静的アセットとマイグレーション SQL を wheel へ含める
artifacts = ["src/coldaisle/web/*", "src/coldaisle/store/migrations/*.sql"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# T20 は print の禁止（AGENTS.md「ログは構造化。print を使わない」の機械的な担保）
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF", "T20"]
# ドキュメント・コメント・ログ文言を日本語で書くプロジェクトのため、
# 全角括弧などを「紛らわしいUnicode」として弾く RUF001/002/003 は無効化する
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_unimported = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# マーカーのタイポを黙って無視すると、実機テストが CI で走る事故になる
addopts = "--strict-markers"
markers = [
    'hardware: 実機が必要なテスト（CI は -m "not hardware" で除外する）',
    'slow: 秒単位で時間がかかるテスト（24時間相当の連続運転など）',
    'realtime: 実時間の CPU の取り合いを測るテスト（決定記録 0133 §2.5）。CI から外すため hardware と併記し、本番のホストで -m realtime で走らせる',
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/coldaisle"]
branch = true

[tool.coverage.report]
show_missing = true
